<!DOCTYPE html>
<html lang="pt-br">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Agenda Fácil{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'agenda/site.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{% if user.is_authenticated %}{% url 'dashboard' %}{% else %}{% url 'login' %}{% endif %}">
            <span class="brand-mark">AF</span>
            <span>Agenda Fácil</span>
        </a>
        {% if user.is_authenticated %}
        <nav class="site-nav" aria-label="Navegação principal">
            <a href="{% url 'dashboard' %}">Painel</a>
            <a href="{% url 'appointment_list' %}">Agenda</a>
            <a href="{% url 'service_list' %}">Serviços</a>
        </nav>
        {% endif %}
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
