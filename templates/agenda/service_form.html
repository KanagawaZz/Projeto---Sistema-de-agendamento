{% extends 'agenda/base.html' %}

{% block title %}Serviço | Agenda Fácil{% endblock %}

{% block content %}
<div class="admin-shell narrow-shell">
    <div class="page-heading compact-heading"><div><p class="eyebrow">Catálogo</p><h1>{% if service %}Editar serviço{% else %}Novo serviço{% endif %}</h1></div><a class="text-link" href="{% url 'service_list' %}">Voltar</a></div>
    <form method="post" class="form-panel stack-form">
        {% csrf_token %}{{ form.as_p }}
        <button class="button button-primary" type="submit">Salvar serviço</button>
    </form>
</div>
{% endblock %}
